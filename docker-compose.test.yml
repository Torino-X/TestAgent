"""Phase 2.8R-G 测试基建 — docker-compose 配置。

3 个服务:
  * mysql-test(3307):主业务库(MySQL 8 + InnoDB)
  * postgres-test(5433):LangGraph Checkpointer 用(Phase 2.8B 跨进程持久化)
  * redis-test(6380):LiveEventBus + InFlightRegistry 跨 worker 锁

所有端口错位(3307 / 5433 / 6380)避免与本地已有开发库冲突。
"""

version: "3.9"

services:
  mysql-test:
    image: mysql:8.0
    container_name: testagent-mysql
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: testagent_test
      MYSQL_USER: test
      MYSQL_PASSWORD: testpass
    ports:
      - "3307:3306"
    command:
      - "--default-authentication-plugin=mysql_native_password"
      - "--innodb_log_file_size=64M"
      - "--max_connections=200"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-ptestpass"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/mysql

  postgres-test:
    image: postgres:16
    container_name: testagent-postgres
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: testpass
      POSTGRES_DB: langgraph_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d langgraph_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7
    container_name: testagent-redis
    # Runtime Redis：策略 noeviction（InFlight / EventBus 协调面不允许淘汰）
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data

  # ── Business Cache Redis（Phase 1 缓存系统测试）──
  # 端口 6381；与 Runtime Redis（6380）隔离；策略 allkeys-lfu
  redis-test-cache:
    image: redis:7
    container_name: testagent-redis-cache
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lfu"]
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    tmpfs:
      - /data