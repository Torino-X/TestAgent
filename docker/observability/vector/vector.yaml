sources:
  testagent_stdout:
    type: docker_logs
    include_containers: ["testagent-backend"]
transforms:
  parse_testagent_json:
    type: remap
    inputs: [testagent_stdout]
    source: |
      parsed, err = parse_json(.message)
      if err == null { . = parsed }
sinks:
  loki:
    type: loki
    inputs: [parse_testagent_json]
    endpoint: http://loki:3100
    encoding: { codec: json }
    labels:
      service: '{{ service ?? "testagent-backend" }}'
      environment: '{{ environment ?? "unknown" }}'
      level: '{{ level ?? "INFO" }}'
      logger: '{{ logger ?? "unknown" }}'
      instance: '{{ host ?? "unknown" }}'
