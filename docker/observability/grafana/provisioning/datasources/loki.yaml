apiVersion: 1
datasources:
  - name: TestAgent Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"([0-9a-f]{32})"'
          url: '$${__value.raw}'
          datasourceUid: tempo
  - name: TestAgent Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
