# nginx 反代 — Phase 2.8R-testagent
#
# 前端 SPA(3000)+ 后端 API(8000)
# 浏览器 → 80/443 → nginx
# /api/v1/*  → backend:8000
# /*        → frontend:3000

upstream testagent_backend {
    server backend:8000;
}

upstream testagent_frontend {
    server frontend:3000;
}

server {
    listen 80 default_server;
    server_name _;

    # Phase 2.8R SSE(/api/agent/tasks/{id}/events)需要长连接
    proxy_buffering off;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    # ── API ──
    location /api/ {
        proxy_pass http://testagent_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Frontend SPA ──
    location / {
        proxy_pass http://testagent_frontend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }
}